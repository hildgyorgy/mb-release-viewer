<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="MusicBrainz Release Viewer continues as MusicBrainz Explorer, with the original viewer and optional playback from your own music library.">
  <meta name="author" content="György Hild">

  <meta property="og:title" content="MusicBrainz Release Viewer has evolved">
  <meta property="og:description" content="Continue with MusicBrainz Explorer — explore releases and optionally play your own music library.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://hildgyorgy.github.io/mb-release-viewer/">
  <meta property="og:image" content="https://hildgyorgy.github.io/mb-release-viewer/apple-touch-icon.png">

  <title>MusicBrainz Release Viewer has evolved</title>
  <link rel="canonical" href="https://hildgyorgy.github.io/mb-explorer/">
  <link rel="icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">

  <style>
    :root {
      color-scheme: light dark;
      --background: #ffffff;
      --text: #13294b;
      --muted: #65738a;
      --link: #536db8;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      padding: 32px 20px;
      background: var(--background);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
    }

    main {
      width: min(100%, 660px);
    }

    .card {
      padding: clamp(24px, 6vw, 48px);
    }

    .logo {
      display: block;
      width: 112px;
      height: 112px;
      margin: 0 auto 34px;
      object-fit: contain;
    }

    h1 {
      margin: 0;
      font-size: clamp(1rem, 2.5vw, 1.16rem);
      font-weight: 400;
      line-height: 1.65;
      color: var(--muted);
    }

    .explorer-link {
      display: inline-block;
      margin-top: 28px;
      color: var(--link);
      font-weight: 700;
      text-decoration: none;
      transition: color 160ms ease;
    }

    .explorer-link:hover {
      color: color-mix(in srgb, var(--link) 76%, var(--text));
    }

    .explorer-link:focus-visible {
      outline: 2px solid var(--link);
      outline-offset: 4px;
    }

    .bookmark-note {
      margin: 22px 0 0;
      color: var(--muted);
      font-size: 0.88rem;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --background: #090c11;
        --text: #eef2fb;
        --muted: #a8b0c0;
        --link: #8da7ed;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .explorer-link {
        transition: none;
      }
    }

    @media (max-width: 520px) {
      body {
        padding: 18px;
      }

      .logo {
        width: 92px;
        height: 92px;
        margin-bottom: 28px;
      }
    }
  </style>
</head>

<body>
  <main>
    <section class="card" aria-labelledby="page-title">
      <img class="logo" src="./assets/icons/MB_go.png" alt="MusicBrainz Explorer logo">
      <h1 id="page-title">
        The Viewer has evolved. The project continues as MusicBrainz Explorer — preserving the original release viewer and adding optional playback from your own music library.
      </h1>
      <a class="explorer-link" href="https://hildgyorgy.github.io/mb-explorer/">
        Open MusicBrainz Explorer&nbsp; →
      </a>
      <p class="bookmark-note">Please update your bookmark.</p>
    </section>
  </main>
</body>

</html>
