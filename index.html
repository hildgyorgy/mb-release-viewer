<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MusicBrainz Release Viewer</title>
  <link rel="icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="assets/styles.css" />
</head>

<body>
<header class="top">
  <div class="top-inner">
    <div class="brand">MusicBrainz Release Viewer</div>

    <div class="search">
      <input id="omni" type="text" autocomplete="off" spellcheck="false"
        placeholder="Paste a MusicBrainz release URL / MBID, or search releases…" />
      <button id="go" class="go-btn" title="Load from MusicBrainz">
        <img src="assets/icons/MB_go.png" alt="MusicBrainz" />
      </button>

      <div class="results" id="results" hidden></div>
    </div>

  </div>
</header>
  <div class="wrap">
    <div id="out"></div>
  </div>
  
<footer class="footer muted">
  <div class="footer-inner">
    <div class="footer-right">
      <div>MB Release Viewer v0.9.5</div>
      <div>Data: MusicBrainz contributors • CC BY-NC-SA 3.0</div>
    </div>
  </div>
</footer>

<script defer src="assets/app.js"></script>
</body>
</html>
